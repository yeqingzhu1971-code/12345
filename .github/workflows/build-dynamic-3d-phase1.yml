name: Build Dynamic 3D Phase 1

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender runtime dependencies and media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xz-utils curl git ffmpeg file \
            libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 libxfixes3 libx11-6

      - name: Download Blender 4.5 LTS
        run: |
          set -euo pipefail
          URLS=(
            "https://download.blender.org/release/Blender4.5/blender-4.5.9-linux-x64.tar.xz"
            "https://mirror.clarkson.edu/blender/release/Blender4.5/blender-4.5.9-linux-x64.tar.xz"
            "https://mirrors.nju.edu.cn/blender/release/Blender4.5/blender-4.5.9-linux-x64.tar.xz"
          )
          for url in "${URLS[@]}"; do
            echo "Trying $url"
            if curl -fL --retry 4 --retry-delay 5 "$url" -o blender.tar.xz; then
              break
            fi
          done
          test -s blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER_BIN="$PWD/$(find . -maxdepth 2 -type f -name blender | head -n 1 | sed 's#^./##')"
          test -x "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"
          "$BLENDER_BIN" --version | tee blender_version.txt

      - name: Fetch MPFB2 human generator
        run: |
          git clone --depth 1 https://github.com/makehumancommunity/mpfb2.git vendor/mpfb2
          test -s vendor/mpfb2/src/mpfb/services/humanservice.py
          git -C vendor/mpfb2 rev-parse HEAD | tee mpfb_commit.txt

      - name: Restore the dynamic 3D builder and verify revised references
        run: |
          set -euo pipefail
          mkdir -p scripts/phase1 output
          {
            echo "Repository files:"
            ls -l scripts/phase1 assets/phase1
            echo "Builder header:"
            xxd -l 16 scripts/phase1/build_dynamic_3d_phase1.py.gz || true
            BUILDER_GZ=scripts/phase1/build_dynamic_3d_phase1.py.gz
            if ! gzip -t "$BUILDER_GZ" 2>/dev/null; then
              echo "Builder was checked out as base64 text; decoding once."
              base64 -d "$BUILDER_GZ" > scripts/phase1/build_dynamic_3d_phase1.decoded.py.gz
              BUILDER_GZ=scripts/phase1/build_dynamic_3d_phase1.decoded.py.gz
              gzip -t "$BUILDER_GZ"
            fi
            gzip -dc "$BUILDER_GZ" > scripts/phase1/build_dynamic_3d_phase1.py
            python -m py_compile scripts/phase1/build_dynamic_3d_phase1.py

            for ref in assets/phase1/female_revised_reference.jpg assets/phase1/male_revised_reference.jpg; do
              test -s "$ref"
              if ! head -c 2 "$ref" | od -An -tx1 | tr -d ' \n' | grep -qi '^ffd8$'; then
                echo "$ref was checked out as base64 text; decoding once."
                base64 -d "$ref" > "$ref.decoded"
                mv "$ref.decoded" "$ref"
              fi
              test "$(head -c 2 "$ref" | od -An -tx1 | tr -d ' \n')" = "ffd8"
            done
            file assets/phase1/female_revised_reference.jpg assets/phase1/male_revised_reference.jpg | tee reference_files.txt
            sha256sum assets/phase1/*.jpg | tee reference_sha256.txt
            wc -l scripts/phase1/build_dynamic_3d_phase1.py
          } 2>&1 | tee output/restore.log

      - name: Build real meshes, skeletons, skinning, animations and full 3D environments
        run: |
          set -o pipefail
          timeout 14400s "$BLENDER_BIN" --factory-startup --background \
            --python scripts/phase1/build_dynamic_3d_phase1.py -- \
            --out "$PWD/output" \
            --female-ref "$PWD/assets/phase1/female_revised_reference.jpg" \
            --male-ref "$PWD/assets/phase1/male_revised_reference.jpg" \
            --mpfb-src "$PWD/vendor/mpfb2/src" \
            2>&1 | tee output/build.log
          test -s output/AI_Short_Drama_Dynamic3D_Phase1_v01.blend
          test -s output/manifest.json

      - name: Render true continuous 3D animations
        run: |
          set -euo pipefail
          BLEND="$PWD/output/AI_Short_Drama_Dynamic3D_Phase1_v01.blend"
          for scene in BDA_Female_Dynamic BDA_3D_Walkthrough Heathrow_Male_Dynamic; do
            echo "Rendering $scene"
            timeout 10800s "$BLENDER_BIN" --background "$BLEND" --scene "$scene" --render-anim \
              2>&1 | tee "output/render_${scene}.log"
          done
          test -s output/BDA_Female_Dynamic_1080p.mp4
          test -s output/BDA_3D_Walkthrough_1080p.mp4
          test -s output/Heathrow_JiangYan_Dynamic_1080p.mp4

      - name: Validate resolution, frame continuity and colour output
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess
          out=pathlib.Path('output')
          videos=[
            out/'BDA_Female_Dynamic_1080p.mp4',
            out/'BDA_3D_Walkthrough_1080p.mp4',
            out/'Heathrow_JiangYan_Dynamic_1080p.mp4',
          ]
          report={}
          for video in videos:
            raw=subprocess.check_output([
              'ffprobe','-v','error','-show_entries',
              'stream=codec_name,width,height,r_frame_rate,avg_frame_rate,nb_frames,pix_fmt,duration:format=duration,size,bit_rate',
              '-of','json',str(video)
            ])
            data=json.loads(raw)
            stream=data['streams'][0]
            width=int(stream['width']);height=int(stream['height'])
            frames=int(stream.get('nb_frames') or 0)
            size=int(data['format']['size'])
            if width != 1920 or height != 1080:
              raise SystemExit(f'{video}: unexpected resolution {width}x{height}')
            if frames < 60:
              raise SystemExit(f'{video}: insufficient temporal frames {frames}')
            if size < 500_000:
              raise SystemExit(f'{video}: file unexpectedly small {size}')
            report[video.name]=data
          (out/'ffprobe_all.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          PY
          for video in output/*.mp4; do
            base="${video%.mp4}"
            ffmpeg -hide_banner -loglevel error -y -i "$video" \
              -vf "fps=2,scale=480:-1,tile=6x1" -frames:v 1 "${base}_contact.jpg" || true
            ffmpeg -hide_banner -loglevel error -i "$video" -f framemd5 - | \
              awk '!/^#/ {print $6}' | sort -u | wc -l > "${base}_unique_frame_hashes.txt"
          done

      - name: Package production files
        if: always()
        run: |
          mkdir -p delivery
          cp -f output/*.blend delivery/ 2>/dev/null || true
          cp -f output/*.glb delivery/ 2>/dev/null || true
          cp -f output/*.mp4 delivery/ 2>/dev/null || true
          cp -f output/*.json delivery/ 2>/dev/null || true
          cp -f output/*contact.jpg delivery/ 2>/dev/null || true
          cp -f output/*hashes.txt delivery/ 2>/dev/null || true
          cp -f output/*.log delivery/ 2>/dev/null || true
          cp -f blender_version.txt mpfb_commit.txt reference_files.txt reference_sha256.txt delivery/ 2>/dev/null || true
          find delivery -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | tee delivery/asset_sizes.txt

      - name: Upload dynamic 3D assets and rendered videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-short-drama-dynamic-3d-phase1-v02
          path: delivery/
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
