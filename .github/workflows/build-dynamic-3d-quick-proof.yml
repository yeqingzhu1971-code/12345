name: Build Dynamic 3D Quick Proof

on:
  push:
    branches: [dynamic-3d-quick-proof-v01]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils curl git ffmpeg file libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 libxfixes3 libx11-6

      - name: Download Blender 4.5 LTS
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 4 https://download.blender.org/release/Blender4.5/blender-4.5.9-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER_BIN="$PWD/$(find . -maxdepth 2 -type f -name blender | head -n 1 | sed 's#^./##')"
          test -x "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Fetch MPFB2 and restore builder
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/makehumancommunity/mpfb2.git vendor/mpfb2
          mkdir -p output scripts/phase1
          cat scripts/phase1/builder.part00.b64 scripts/phase1/builder.part01.b64 scripts/phase1/builder.part02.b64 | tr -d '\r\n\t ' > output/builder.b64
          base64 -d output/builder.b64 > output/builder.py.gz
          gzip -t output/builder.py.gz
          gzip -dc output/builder.py.gz > scripts/phase1/build_dynamic_3d_phase1.py
          python scripts/phase1/runtime_patch.py scripts/phase1/build_dynamic_3d_phase1.py
          python -m py_compile scripts/phase1/build_dynamic_3d_phase1.py
          test -s assets/phase1/female_revised_reference.jpg
          test -s assets/phase1/male_revised_reference.jpg

      - name: Build rigged characters and complete 3D scenes
        run: |
          set -o pipefail
          timeout 10800s "$BLENDER_BIN" --factory-startup --background \
            --python scripts/phase1/build_dynamic_3d_phase1.py -- \
            --out "$PWD/output" \
            --female-ref "$PWD/assets/phase1/female_revised_reference.jpg" \
            --male-ref "$PWD/assets/phase1/male_revised_reference.jpg" \
            --mpfb-src "$PWD/vendor/mpfb2/src" \
            2>&1 | tee output/build.log
          test -s output/AI_Short_Drama_Dynamic3D_Phase1_v01.blend

      - name: Prepare a 48-frame native 1080p female proof
        run: |
          set -euo pipefail
          BLEND="$PWD/output/AI_Short_Drama_Dynamic3D_Phase1_v01.blend"
          QUICK="$PWD/output/BDA_Female_Dynamic_Quick.blend"
          OUTFILE="$PWD/output/BDA_Female_Dynamic_Quick_1080p.mp4"
          "$BLENDER_BIN" --background "$BLEND" --python-expr "import bpy; s=bpy.data.scenes['BDA_Female_Dynamic']; s.frame_start=1; s.frame_end=48; s.render.filepath=r'$OUTFILE'; bpy.context.window.scene=s if bpy.context.window else None; bpy.ops.wm.save_as_mainfile(filepath=r'$QUICK')"
          timeout 7200s "$BLENDER_BIN" --background "$QUICK" --scene BDA_Female_Dynamic --render-anim 2>&1 | tee output/render_quick.log
          test -s "$OUTFILE"

      - name: Validate real temporal motion
        run: |
          set -euo pipefail
          VIDEO=output/BDA_Female_Dynamic_Quick_1080p.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,avg_frame_rate,nb_frames,pix_fmt,duration -show_entries format=duration,size,bit_rate -of json "$VIDEO" | tee output/ffprobe.json
          python - <<'PY'
          import cv2,json,numpy as np
          p='output/BDA_Female_Dynamic_Quick_1080p.mp4'; c=cv2.VideoCapture(p); frames=[]; colour=[]
          while True:
              ok,f=c.read()
              if not ok: break
              frames.append(cv2.cvtColor(f,cv2.COLOR_BGR2GRAY))
              colour.append(float(np.mean(np.max(f,axis=2)-np.min(f,axis=2))))
          if len(frames)<40: raise SystemExit(f'insufficient frames: {len(frames)}')
          d=np.array([np.mean(cv2.absdiff(frames[i],frames[i-1])) for i in range(1,len(frames))])
          q={'frames':len(frames),'mean_diff':float(d.mean()),'motion_ratio':float((d>.2).mean()),'colour_proxy':float(np.mean(colour))}
          open('output/motion_qc.json','w').write(json.dumps(q,indent=2)); print(q)
          if q['motion_ratio']<.50: raise SystemExit('motion gate failed')
          if q['colour_proxy']<2.0: raise SystemExit('colour gate failed')
          PY
          ffmpeg -hide_banner -loglevel error -y -i "$VIDEO" -vf "fps=4,scale=480:-1,tile=8x1" -frames:v 1 output/contact.jpg || true

      - name: Package quick proof
        if: always()
        run: |
          mkdir -p delivery
          cp -f output/BDA_Female_Dynamic_Quick_1080p.mp4 delivery/ 2>/dev/null || true
          cp -f output/BDA_Female_Dynamic_Quick.blend delivery/ 2>/dev/null || true
          cp -f output/Female_Lead_Rigged_Animated_v01.glb delivery/ 2>/dev/null || true
          cp -f output/BDA_Classroom_3D_v01.glb delivery/ 2>/dev/null || true
          cp -f output/ffprobe.json output/motion_qc.json output/contact.jpg output/*.log delivery/ 2>/dev/null || true
          find delivery -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | tee delivery/sizes.txt

      - name: Upload quick dynamic proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-3d-female-quick-proof-v02
          path: delivery/
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
