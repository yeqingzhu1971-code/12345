name: Build AI Short Drama 3D Assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils curl git libxrender1 libxi6 libxkbcommon0 libsm6 libgl1

      - name: Download Blender 4.5.9 LTS
        run: |
          set -euxo pipefail
          URLS=(
            "https://download.blender.org/release/Blender4.5/blender-4.5.9-linux-x64.tar.xz"
            "https://mirror.clarkson.edu/blender/release/Blender4.5/blender-4.5.9-linux-x64.tar.xz"
            "https://mirrors.nju.edu.cn/blender/release/Blender4.5/blender-4.5.9-linux-x64.tar.xz"
          )
          for url in "${URLS[@]}"; do
            if curl -fL --retry 4 --retry-delay 4 "$url" -o blender.tar.xz; then break; fi
          done
          test -s blender.tar.xz
          tar -xf blender.tar.xz
          echo "BLENDER_BIN=$PWD/$(find . -maxdepth 2 -type f -name blender | head -n 1 | sed 's#^./##')" >> "$GITHUB_ENV"

      - name: Get MPFB2 human generator
        run: |
          git clone --depth 1 https://github.com/makehumancommunity/mpfb2.git vendor/mpfb2
          echo "MPFB_SRC=$PWD/vendor/mpfb2/src" >> "$GITHUB_ENV"

      - name: Restore procedural build script
        env:
          SCRIPT_B64: ""
        run: |
          python3 - <<'PYCODE'
          import os,base64,gzip,pathlib
          data=gzip.decompress(base64.b64decode(os.environ['SCRIPT_B64']))
          pathlib.Path('build_opening_assets.py').write_bytes(data)
          PYCODE
          python3 -m py_compile build_opening_assets.py

      - name: Build Blender, GLB and 16:9 preview assets
        env:
          OUTPUT_DIR: ${{ github.workspace }}/output
          MPFB_SRC: ${{ github.workspace }}/vendor/mpfb2/src
        run: |
          set -o pipefail
          mkdir -p output
          "$BLENDER_BIN" --background --factory-startup --python build_opening_assets.py 2>&1 | tee output/blender_build.log

      - name: Package output
        if: always()
        run: |
          test -d output || mkdir -p output
          python3 - <<'PYCODE'
          import os,zipfile
          root='output'
          with zipfile.ZipFile('AI_Short_Drama_Opening_3D_Assets_v01.zip','w',zipfile.ZIP_DEFLATED,allowZip64=True) as z:
              for dp,_,fs in os.walk(root):
                  for f in fs:
                      p=os.path.join(dp,f)
                      z.write(p,os.path.relpath(p,root))
          PYCODE

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Short-Drama-Opening-3D-Assets-v01
          path: |
            AI_Short_Drama_Opening_3D_Assets_v01.zip
            output/
          compression-level: 0
          retention-days: 30
          if-no-files-found: warn
