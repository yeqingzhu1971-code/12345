name: Generate Creen Jiang Yan Airport Clip

on:
  push:
    branches: [creen-male-airport-v01]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          pip install playwright opencv-python-headless numpy
          playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate revised Jiang Yan in private Heathrow suite
        run: |
          set -o pipefail
          mkdir -p output
          python - <<'PY' 2>&1 | tee output/generation.log
          import asyncio,base64,json,re,time
          from pathlib import Path
          from playwright.async_api import async_playwright

          REF=Path('assets/male_ref.jpg')
          print('reference exists',REF.exists(),'bytes',REF.stat().st_size if REF.exists() else 0)
          if not REF.exists() or REF.stat().st_size<5000:raise RuntimeError('revised male asset missing')
          PROMPT=('Single uninterrupted cinematic live-action shot. Preserve exactly the refined East Asian man in the reference: same facial proportions, black side-parted hair, straight brows, calm dark eyes, clean jaw, natural skin texture and thin gold wire-frame glasses. '
          'He is Jiang Yan, around twenty-eight and about 180 cm tall, wearing a matte all-black casual shirt, straight black trousers and a dark charcoal wool overcoat, never a white shirt. '
          'He sits alone in a small semi-enclosed four-seat first-class quiet suite at London Heathrow Terminal 3. Tall smoked-glass and dark walnut partitions create privacy; dark stone, muted bronze details and one dim practical table lamp, never a large public lounge or hotel lobby. '
          'Beyond the rain-streaked floor-to-ceiling glass is an Emirates-style A380 and a wet airport apron under a dense lead-grey sky. Low saturation full-colour image, cool overcast light, almost no warm ambient lighting, no bright blue sky. '
          'He remains seated, breathes naturally, blinks once, lowers his gaze toward the smartphone and makes one small controlled thumb movement. His jaw tightens slightly with contained anxiety. Rain droplets move slowly down the glass and one distant service vehicle passes. '
          'Extremely slow stable dolly-in, realistic face, hands, glasses, cloth and wet reflections, shallow 35mm cinematic depth of field, premium restrained Chinese romantic drama. No speech, no subtitles, no text, no logo, no watermark, no identity drift, no face morphing, no black-frame glasses, no white shirt, no standing, no exaggerated movement, no orange lighting, no black-and-white, no flicker, no frozen frames, no slideshow or zoom-only animation.')

          def collect_urls(x):
            out=[]
            if isinstance(x,dict):
              for k,v in x.items():
                if isinstance(v,str) and v.startswith(('http://','https://')) and any(e in v.lower() for e in ('.mp4','.webm','.mov')):out.append(v)
                out+=collect_urls(v)
            elif isinstance(x,(list,tuple)):
              for v in x:out+=collect_urls(v)
            return list(dict.fromkeys(out))

          async def save_video(page,ctx,initial,api_urls):
            srcs=await page.evaluate("() => [...document.querySelectorAll('video,video source')].map(e=>e.currentSrc||e.src||e.getAttribute('src')||'').filter(Boolean)")
            for src in list(dict.fromkeys([s for s in srcs if s not in initial]+api_urls)):
              try:
                if src.startswith('blob:'):
                  b64=await page.evaluate("""async u=>{const a=new Uint8Array(await (await fetch(u)).arrayBuffer());let s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)}""",src);data=base64.b64decode(b64)
                else:
                  r=await ctx.request.get(src,timeout=180000);data=await r.body() if r.ok else b''
                if len(data)>10000:Path('output/creen_source.mp4').write_bytes(data);Path('output/media_url.txt').write_text(src);return True
              except Exception as e:print('media recovery error',repr(e),src)
            return False

          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--disable-dev-shm-usage'])
              ctx=await browser.new_context(viewport={'width':1440,'height':1050},locale='en-US',accept_downloads=True)
              page=await ctx.new_page();network=[];api_urls=[]
              page.on('console',lambda m:print('CONSOLE',m.type,m.text));page.on('pageerror',lambda e:print('PAGEERROR',e))
              async def capture(resp):
                u=resp.url.lower();ct=(resp.headers.get('content-type') or '').lower()
                if '/api/' in u or 'video/' in ct or any(k in u for k in ('generate','task','upload','media')):
                  rec={'status':resp.status,'url':resp.url,'ct':ct}
                  if 'json' in ct:
                    try:j=await resp.json();rec['json']=j;api_urls.extend(collect_urls(j))
                    except Exception as e:rec['error']=repr(e)
                  network.append(rec)
              page.on('response',lambda r:asyncio.create_task(capture(r)))
              await page.goto('https://www.creen.ai/image-to-video',wait_until='networkidle',timeout=120000);await page.wait_for_timeout(7000)
              initial=set(await page.evaluate("() => [...document.querySelectorAll('video,video source')].map(e=>e.currentSrc||e.src||e.getAttribute('src')||'').filter(Boolean)"))
              await page.locator('input[type=file]').first.set_input_files(str(REF))
              await page.locator('textarea[placeholder="Describe what you want to create"]').fill(PROMPT);await page.wait_for_timeout(4000)
              res=page.get_by_role('button',name=re.compile(r'\d+p\s*\|\s*16:9')).first
              if await res.count():
                try:
                  await res.click();await page.wait_for_timeout(600)
                  for label in ('1080p','1024p','720p','768p'):
                    q=page.get_by_text(label,exact=True)
                    if await q.count():
                      try:await q.last.click();print('selected resolution',label);break
                      except Exception as e:print('resolution unavailable',label,repr(e))
                except Exception as e:print('resolution menu error',repr(e))
              submit=page.locator("xpath=//button[.//*[name()='path' and starts-with(@d,'M12 20V4')]]").last
              for _ in range(120):
                if not await submit.is_disabled():break
                await page.wait_for_timeout(1000)
              await page.screenshot(path='output/ready.png',full_page=True)
              if await submit.is_disabled():raise RuntimeError('Creen submit remained disabled')
              await submit.click();print('generation submitted');await page.screenshot(path='output/submitted.png',full_page=True)
              deadline=time.time()+65*60;last='';assets=False
              while time.time()<deadline:
                await page.wait_for_timeout(5000);Path('output/network.json').write_text(json.dumps(network[-2000:],ensure_ascii=False,indent=2,default=str),encoding='utf-8')
                body=await page.locator('body').inner_text()
                if body!=last:print('BODY',body[:7000].replace('\n',' | '));last=body
                if await save_video(page,ctx,initial,api_urls):break
                if not assets and time.time()>deadline-58*60:
                  try:await page.goto('https://www.creen.ai/my-assets',wait_until='networkidle',timeout=120000);await page.wait_for_timeout(5000);assets=True
                  except Exception as e:print('asset navigation error',repr(e))
                elif assets:
                  await page.reload(wait_until='networkidle',timeout=120000);await page.wait_for_timeout(3000)
              if not Path('output/creen_source.mp4').exists():
                await page.screenshot(path='output/timeout.png',full_page=True);raise TimeoutError('No Creen video recovered')
              await page.screenshot(path='output/completed.png',full_page=True);await browser.close()
          asyncio.run(main())
          PY
      - name: Validate and export 1080p
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames,pix_fmt,duration -show_entries format=duration,size,bit_rate -of json output/creen_source.mp4 | tee output/source_ffprobe.json
          ffmpeg -y -i output/creen_source.mp4 -vf "scale=1920:1080:force_original_aspect_ratio=decrease:flags=lanczos,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:black,unsharp=5:5:0.12:5:5:0,format=yuv420p" -c:v libx264 -preset slow -crf 14 -movflags +faststart -an output/JiangYan_Heathrow_private_suite_review_1080p.mp4
          python - <<'PY'
          import cv2,numpy as np,json
          c=cv2.VideoCapture('output/creen_source.mp4');g=[];colour=[]
          while True:
            ok,f=c.read()
            if not ok:break
            g.append(cv2.cvtColor(f,cv2.COLOR_BGR2GRAY));colour.append(float(np.mean(np.max(f,axis=2)-np.min(f,axis=2))))
          if len(g)<24:raise SystemExit(f'too few frames {len(g)}')
          d=np.array([np.mean(cv2.absdiff(g[i],g[i-1])) for i in range(1,len(g))]);q={'frames':len(g),'mean_diff':float(d.mean()),'motion_ratio':float((d>.45).mean()),'colour_proxy':float(np.mean(colour))};open('output/qc.json','w').write(json.dumps(q,indent=2));print(q)
          if q['motion_ratio']<.40:raise SystemExit('static/slideshow motion rejected')
          if q['colour_proxy']<2:raise SystemExit('monochrome output rejected')
          PY
          ffmpeg -y -i output/creen_source.mp4 -vf "fps=4,scale=360:-1,tile=6x1" -frames:v 1 output/contact.jpg || true
      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creen-jiangyan-heathrow-v01
          path: output/
          compression-level: 0
          retention-days: 7
