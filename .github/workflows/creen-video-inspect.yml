name: Inspect Creen Image-to-Video App

on:
  push:
    branches: [creen-video-test-v01]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Inspect UI and network
        run: |
          mkdir -p output
          python - <<'PY' 2>&1 | tee output/inspect.log
          import asyncio,json
          from pathlib import Path
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True,args=['--disable-dev-shm-usage'])
              c=await b.new_context(viewport={'width':1440,'height':1100},locale='en-US')
              page=await c.new_page();net=[]
              async def rr(r):
                u=r.url.lower();ct=(r.headers.get('content-type') or '').lower()
                if any(k in u for k in ['api','upload','generate','task','video','media','model']) or 'video/' in ct:net.append({'status':r.status,'url':r.url,'ct':ct})
              page.on('response',rr);page.on('console',lambda m:print('CONSOLE',m.type,m.text));page.on('pageerror',lambda e:print('PAGEERROR',e))
              r=await page.goto('https://www.creen.ai/image-to-video',wait_until='networkidle',timeout=120000)
              print('status',r.status if r else None,'url',page.url,'title',await page.title())
              await page.wait_for_timeout(7000)
              await page.screenshot(path='output/page.png',full_page=True)
              controls=await page.evaluate("""() => [...document.querySelectorAll('input,textarea,button,select,[role=button]')].map((e,i)=>({i,tag:e.tagName,type:e.type||'',name:e.name||'',id:e.id||'',placeholder:e.placeholder||'',aria:e.getAttribute('aria-label')||'',text:(e.innerText||e.value||'').trim().slice(0,200),accept:e.accept||'',disabled:!!e.disabled,outer:e.outerHTML.slice(0,500)}))""")
              Path('output/controls.json').write_text(json.dumps(controls,ensure_ascii=False,indent=2),encoding='utf-8')
              Path('output/network.json').write_text(json.dumps(net,ensure_ascii=False,indent=2),encoding='utf-8')
              Path('output/page.html').write_text(await page.content(),encoding='utf-8')
              print(json.dumps(controls,ensure_ascii=False,indent=2));print('BODY',(await page.locator('body').inner_text())[:15000])
              await b.close()
          asyncio.run(main())
          PY
      - name: Upload inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creen-video-inspection-v01
          path: output/
          retention-days: 7
