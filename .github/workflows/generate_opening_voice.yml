name: Generate Opening Voice Assets

on:
  push:
    branches: [build-opening-assets]
    paths:
      - '.github/workflows/generate_opening_voice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install voice tools
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate Mandarin character voices
        run: |
          mkdir -p voice
          edge-tts --voice zh-CN-YunxiNeural --rate=-8% --pitch=-6Hz --text '希思罗机场的落地玻璃蒙着细密的雨痕。铅灰色的云压得很低，把上午十点的天光浸得像傍晚。' --write-media voice/m01.mp3
          edge-tts --voice zh-CN-YunxiNeural --rate=-7% --pitch=-6Hz --text '这是江砚来英国读博的第二年。秋季学期的第一个月结束，他正赶回北京开会。' --write-media voice/m02.mp3
          edge-tts --voice zh-CN-YunxiNeural --rate=-8% --pitch=-6Hz --text '屏幕上还停在家族群里叔伯们明争暗斗的话术。太阳穴突突地跳，他只想随便找点东西分心。' --write-media voice/m03.mp3
          edge-tts --voice zh-CN-YunxiNeural --rate=-6% --pitch=-5Hz --text '下一秒，手机里明晃晃的阳光，先撞进了眼里。' --write-media voice/m04.mp3
          edge-tts --voice zh-CN-XiaoxiaoNeural --rate=+8% --pitch=+5Hz --text '主席，等一下！' --write-media voice/friend.mp3
          edge-tts --voice zh-CN-XiaoyiNeural --rate=+7% --pitch=+8Hz --text '来了！' --write-media voice/female.mp3
          edge-tts --voice zh-CN-YunxiNeural --rate=-7% --pitch=-5Hz --text '穿着洗得发白的练功服的女孩猛地回过头。额前碎发被汗湿，梨窝陷得很深，笑得眼睛弯成两弯月牙。' --write-media voice/m05.mp3
          edge-tts --voice zh-CN-YunxiNeural --rate=-8% --pitch=-6Hz --text '江砚把那段视频看了三遍。' --write-media voice/m06.mp3
          edge-tts --voice zh-CN-YunxiNeural --rate=-8% --pitch=-6Hz --text '他点开私信，敲下一行字。你知道吗？你笑起来的时候，好像一个明星。' --write-media voice/m07.mp3
          edge-tts --voice en-GB-SoniaNeural --rate=-4% --pitch=+0Hz --text 'Emirates flight E K zero zero two to Dubai is now boarding First and Business Class passengers.' --write-media voice/airport.mp3
          edge-tts --voice zh-CN-YunxiNeural --rate=-9% --pitch=-7Hz --text '他以为自己最多只需要等一个晚上。没人知道，这一等，就是整整三百六十五天。' --write-media voice/m08.mp3
      - name: Make audio manifest
        run: |
          python - <<'PY'
          import json, glob, os, subprocess
          out=[]
          for p in sorted(glob.glob('voice/*.mp3')):
              d=subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',p],text=True).strip()
              out.append({'file':os.path.basename(p),'duration':float(d)})
          open('voice/manifest.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Upload voice assets
        uses: actions/upload-artifact@v4
        with:
          name: opening-voice-assets-v01
          path: voice/
          retention-days: 30
