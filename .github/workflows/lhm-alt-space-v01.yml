name: Generate Heroine with Alternate LHM Space

on:
  push:
    branches: [lhm-alt-space-v01]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install client and media tools
        run: |
          pip install -U gradio_client requests opencv-python-headless numpy
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Run alternate LHM Space with revised heroine
        run: |
          set -o pipefail
          mkdir -p output
          python - <<'PY' 2>&1 | tee output/generation.log
          import json, os, shutil, time
          from pathlib import Path
          import requests
          from gradio_client import Client, handle_file

          image=Path('assets/lhm/female_fullbody_revised_v01.jpg')
          if not image.exists() or image.stat().st_size < 10000:
              raise RuntimeError('Revised heroine reference missing')

          motion_url='https://3daigc-lhm.hf.space/gradio_api/file=/tmp/gradio/081231294fc7c503fc2f21f8958363983885cf77aaa7cc99ee20ae0f04edaba4/mimo2_origin.mp4'
          r=requests.get(motion_url,timeout=180,headers={'User-Agent':'Mozilla/5.0'})
          print('motion',r.status_code,len(r.content))
          r.raise_for_status(); Path('mimo2.mp4').write_bytes(r.content)

          spaces=['multimodalart/LHM','svjack/LHM','guardiancc/LHM']
          errors={}
          for space in spaces:
              try:
                  print('TRY SPACE',space)
                  client=Client(space,verbose=True,download_files=True)
                  try:
                      api=client.view_api(return_format='dict')
                  except TypeError:
                      api=client.view_api()
                  Path(f'output/api_{space.replace("/","_")}.json').write_text(json.dumps(api,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
                  names=(api or {}).get('named_endpoints',{}) if isinstance(api,dict) else {}
                  print('ENDPOINTS',list(names))
                  if '/prepare_working_dir' in names:
                      print('prepare',client.predict(api_name='/prepare_working_dir'))
                  endpoint='/core_fn' if '/core_fn' in names else next((x for x in names if 'core' in x.lower()),None)
                  if not endpoint:
                      raise RuntimeError('No core generation endpoint')
                  job=client.submit(handle_file(str(image)),{'video':handle_file('mimo2.mp4'),'subtitles':None},api_name=endpoint)
                  while not job.done():
                      print(space,'status',job.status());time.sleep(15)
                  result=job.result();print(space,'RESULT',repr(result))
                  Path('output/result.json').write_text(json.dumps({'space':space,'result':result},ensure_ascii=False,indent=2,default=str),encoding='utf-8')

                  def paths(x):
                      out=[]
                      if isinstance(x,str) and os.path.exists(x):out.append(x)
                      elif isinstance(x,dict):
                          for v in x.values():out+=paths(v)
                      elif isinstance(x,(list,tuple)):
                          for v in x:out+=paths(v)
                      return out
                  allp=paths(result)
                  vids=[p for p in allp if p.lower().endswith(('.mp4','.webm','.mov'))]
                  imgs=[p for p in allp if p.lower().endswith(('.png','.jpg','.jpeg'))]
                  if not vids:raise RuntimeError(f'No video in result: {result!r}')
                  shutil.copy2(vids[-1],'output/female_lhm_alt_source.mp4')
                  if imgs:shutil.copy2(imgs[0],'output/female_lhm_alt_processed.png')
                  Path('output/selected_space.txt').write_text(space,encoding='utf-8')
                  break
              except Exception as e:
                  print('SPACE FAILED',space,repr(e));errors[space]=repr(e)
          else:
              Path('output/errors.json').write_text(json.dumps(errors,indent=2),encoding='utf-8')
              raise RuntimeError('All alternate LHM Spaces failed: '+repr(errors))
          PY

      - name: Validate and export 1080p review
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,avg_frame_rate,nb_frames,pix_fmt,duration -show_entries format=duration,size,bit_rate -of json output/female_lhm_alt_source.mp4 | tee output/ffprobe.json
          ffmpeg -y -i output/female_lhm_alt_source.mp4 -vf "scale=1080:1080:force_original_aspect_ratio=decrease:flags=lanczos,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:white,format=yuv420p" -c:v libx264 -preset slow -crf 14 -movflags +faststart -an output/female_lhm_alt_review_1920x1080.mp4
          python - <<'PY'
          import cv2,json,numpy as np
          p='output/female_lhm_alt_source.mp4';c=cv2.VideoCapture(p);frames=[];colour=[]
          while True:
              ok,f=c.read()
              if not ok:break
              frames.append(cv2.cvtColor(f,cv2.COLOR_BGR2GRAY));colour.append(float(np.mean(np.max(f,axis=2)-np.min(f,axis=2))))
          if len(frames)<24:raise SystemExit(f'too few frames {len(frames)}')
          d=np.array([np.mean(cv2.absdiff(frames[i],frames[i-1])) for i in range(1,len(frames))])
          q={'frames':len(frames),'mean_diff':float(d.mean()),'p90_diff':float(np.percentile(d,90)),'motion_ratio':float((d>.35).mean()),'colour_proxy':float(np.mean(colour))}
          open('output/qc.json','w').write(json.dumps(q,indent=2));print(q)
          if q['motion_ratio']<.45:raise SystemExit('static output rejected')
          if q['colour_proxy']<3:raise SystemExit('monochrome output rejected')
          PY
          ffmpeg -hide_banner -loglevel error -y -i output/female_lhm_alt_source.mp4 -vf "fps=2,scale=240:-1,tile=8x1" -frames:v 1 output/contact.jpg || true

      - name: Upload alternate-space result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhm-alt-space-heroine-v01
          path: output/
          retention-days: 14
          compression-level: 0
