name: Compare Calmer LHM Heroine Motions V02

on:
  push:
    branches: [lhm-female-motion-tests-v02]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - motion: mimo2
            index: 2
          - motion: mimo4
            index: 3
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser and media tools
        run: |
          pip install playwright opencv-python-headless numpy
          playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generate revised heroine with ${{ matrix.motion }} motion
        env:
          MOTION_NAME: ${{ matrix.motion }}
          MOTION_INDEX: ${{ matrix.index }}
        run: |
          set -o pipefail
          mkdir -p output
          python - <<'PY' 2>&1 | tee output/browser_generation.log
          import asyncio, base64, json, os, time
          from pathlib import Path
          from playwright.async_api import async_playwright

          IMAGE='assets/lhm/female_fullbody_revised_v01.jpg'
          MOTION=os.environ['MOTION_NAME']
          INDEX=int(os.environ['MOTION_INDEX'])

          async def save_video(page, context, src):
              if src.startswith('blob:'):
                  encoded=await page.evaluate("""async (u)=>{
                    const a=new Uint8Array(await (await fetch(u)).arrayBuffer());
                    let s=''; const n=32768;
                    for(let i=0;i<a.length;i+=n) s+=String.fromCharCode(...a.subarray(i,i+n));
                    return btoa(s);
                  }""",src)
                  data=base64.b64decode(encoded)
              else:
                  if src.startswith('/'):
                      src='https://3daigc-lhm.hf.space'+src
                  r=await context.request.get(src,timeout=300000)
                  print('video GET',r.status,src)
                  if not r.ok:
                      return False
                  data=await r.body()
              if len(data)<10000:
                  return False
              Path(f'output/female_lhm_{MOTION}_source.mp4').write_bytes(data)
              Path('output/video_source.txt').write_text(src,encoding='utf-8')
              print('saved generated video bytes',len(data))
              return True

          async def select_motion(page):
              selectors=[
                  '#component-18 button',
                  '#component-18 [role="button"]',
                  '#component-18 .gallery-item',
                  '#component-18 .thumbnail-item',
              ]
              chosen=False
              for selector in selectors:
                  items=page.locator(selector)
                  count=await items.count()
                  print('motion selector',selector,'count',count)
                  if count>INDEX:
                      await items.nth(INDEX).click(force=True)
                      chosen=True
                      break
              if not chosen:
                  datasets=page.locator('[data-testid="dataset"], .dataset, gradio-dataset')
                  print('dataset fallback count',await datasets.count())
                  if await datasets.count()<2:
                      raise RuntimeError('Could not locate the target-motion example dataset')
                  items=datasets.nth(1).locator('button,[role="button"],.gallery-item,.thumbnail-item')
                  print('dataset item count',await items.count())
                  if await items.count()<=INDEX:
                      raise RuntimeError('Target-motion dataset did not expose the requested sample index')
                  await items.nth(INDEX).click(force=True)
              await page.wait_for_timeout(6000)
              vids=await page.evaluate("""() => [...document.querySelectorAll('video')].map((v,i)=>({i,src:v.currentSrc||v.src||'',poster:v.poster||''}))""")
              Path('output/videos_after_selection.json').write_text(json.dumps(vids,ensure_ascii=False,indent=2),encoding='utf-8')
              print('videos after motion selection',json.dumps(vids,ensure_ascii=False,indent=2))
              target=[v for v in vids if MOTION in (v.get('src') or '').lower()]
              if not target:
                  raise RuntimeError(f'Selected motion source does not contain expected name {MOTION}')

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True,args=['--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required'])
                  context=await browser.new_context(viewport={'width':1600,'height':1200},locale='en-US',accept_downloads=True)
                  page=await context.new_page()
                  network=[]
                  page.on('console',lambda m:print('CONSOLE',m.type,m.text))
                  page.on('pageerror',lambda e:print('PAGEERROR',e))
                  async def capture(resp):
                      u=resp.url.lower();ct=(resp.headers.get('content-type') or '').lower()
                      if 'gradio_api' in u or 'queue' in u or 'video/' in ct:
                          network.append({'status':resp.status,'url':resp.url,'content_type':ct})
                  page.on('response',capture)

                  await page.goto('https://3daigc-lhm.hf.space/',wait_until='domcontentloaded',timeout=180000)
                  await page.wait_for_selector('#content_image',timeout=180000)
                  await page.wait_for_timeout(8000)

                  upload=page.locator('#content_image input[type=file]')
                  if not await upload.count():
                      upload=page.locator('input[type=file]').first
                  await upload.set_input_files(IMAGE)
                  await page.wait_for_timeout(10000)
                  await select_motion(page)
                  await page.screenshot(path=f'output/{MOTION}_ready.png',full_page=True)

                  button=page.locator('#openlrm_generate button')
                  if not await button.count():
                      button=page.get_by_role('button',name='Generate',exact=True)
                  await button.first.click()
                  print('generate clicked for',MOTION)

                  deadline=time.time()+95*60
                  previous=''
                  recovered=False
                  while time.time()<deadline:
                      await page.wait_for_timeout(10000)
                      body=await page.locator('body').inner_text()
                      compact=' | '.join(x.strip() for x in body.splitlines() if x.strip())
                      if compact!=previous:
                          print('BODY',compact[:8000])
                          previous=compact
                      Path('output/latest_body.txt').write_text(body,encoding='utf-8')
                      Path('output/network.json').write_text(json.dumps(network[-2000:],ensure_ascii=False,indent=2),encoding='utf-8')

                      output=page.locator('#openlrm_render_video video')
                      if await output.count():
                          src=await output.first.evaluate("v=>v.currentSrc||v.src||''")
                          duration=await output.first.evaluate("v=>Number.isFinite(v.duration)?v.duration:0")
                          ready=await output.first.evaluate("v=>v.readyState")
                          print('output candidate',src,'duration',duration,'ready',ready)
                          if src and duration>0 and ready>=1 and await save_video(page,context,src):
                              recovered=True
                              break

                      low=body.lower()
                      if any(x in low for x in ['runtime error','out of quota','gpu quota exceeded','failed to generate','application error']):
                          await page.screenshot(path='output/error.png',full_page=True)
                          raise RuntimeError('LHM interface execution error: '+compact[-2000:])

                  await page.screenshot(path='output/completed_or_timeout.png',full_page=True)
                  if not recovered:
                      raise TimeoutError('LHM did not expose the requested generated result within 95 minutes')
                  await browser.close()

          asyncio.run(main())
          PY

      - name: Validate motion and export 1080p review
        env:
          MOTION_NAME: ${{ matrix.motion }}
        run: |
          set -euo pipefail
          SRC="output/female_lhm_${MOTION_NAME}_source.mp4"
          OUT="output/female_lhm_${MOTION_NAME}_review_1920x1080.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,avg_frame_rate,nb_frames,pix_fmt,duration -show_entries format=duration,size,bit_rate -of json "$SRC" | tee output/source_ffprobe.json
          ffmpeg -y -i "$SRC" -vf "scale=1080:1080:force_original_aspect_ratio=decrease:flags=lanczos,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:white,format=yuv420p" -c:v libx264 -preset slow -crf 14 -movflags +faststart -an "$OUT"
          python - <<'PY'
          import cv2,json,numpy as np,os
          m=os.environ['MOTION_NAME'];p=f'output/female_lhm_{m}_source.mp4';c=cv2.VideoCapture(p);frames=[];colour=[]
          while True:
              ok,f=c.read()
              if not ok:break
              frames.append(cv2.cvtColor(f,cv2.COLOR_BGR2GRAY));colour.append(float(np.mean(np.max(f,axis=2)-np.min(f,axis=2))))
          if len(frames)<24:raise SystemExit(f'too few frames: {len(frames)}')
          d=np.array([np.mean(cv2.absdiff(frames[i],frames[i-1])) for i in range(1,len(frames))])
          q={'motion':m,'frames':len(frames),'mean_diff':float(d.mean()),'p90_diff':float(np.percentile(d,90)),'motion_ratio':float((d>.35).mean()),'colour_proxy':float(np.mean(colour))}
          open('output/motion_qc.json','w').write(json.dumps(q,indent=2));print(q)
          if q['motion_ratio']<.45:raise SystemExit('motion gate failed')
          if q['colour_proxy']<3:raise SystemExit('colour gate failed')
          PY
          ffmpeg -hide_banner -loglevel error -y -i "$SRC" -vf "fps=2,scale=240:-1,tile=8x1" -frames:v 1 output/contact.jpg || true

      - name: Upload motion comparison proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhm-female-${{ matrix.motion }}-v02
          path: output/
          retention-days: 14
          compression-level: 0
