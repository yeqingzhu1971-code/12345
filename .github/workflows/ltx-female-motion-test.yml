name: LTX Female Motion Test

on:
  push:
    branches: [ltx-female-motion-test-v01]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install client
        run: pip install -U gradio_client
      - name: Inspect LTX Video Fast API
        run: |
          mkdir -p output
          python - <<'PY' 2>&1 | tee output/ltx_api.log
          import json
          from gradio_client import Client
          client = Client('Lightricks/ltx-video-distilled')
          info = client.view_api(return_format='dict')
          print(json.dumps(info, ensure_ascii=False, indent=2, default=str))
          open('output/ltx_api.json','w',encoding='utf-8').write(json.dumps(info,ensure_ascii=False,indent=2,default=str))
          PY
      - name: Upload inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltx-api-inspection
          path: output/
          retention-days: 7
