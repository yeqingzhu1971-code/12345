name: Probe Public Video Generation Space

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Gradio client
        run: python -m pip install --upgrade gradio_client

      - name: Inspect official public video Spaces
        run: python scripts/probe_video_space.py

      - name: Upload API inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-video-space-api-probe
          path: probe_output/
          retention-days: 7
          if-no-files-found: warn
