name: Probe Official Wan Video Spaces

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gradio client
        run: python -m pip install --upgrade gradio_client
      - name: Inspect official Wan APIs
        run: |
          set -o pipefail
          mkdir -p wan_probe_output
          python scripts/probe_wan_video_spaces.py 2>&1 | tee wan_probe_output/probe.log
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wan-video-space-api-probe
          path: wan_probe_output/
          retention-days: 7
          if-no-files-found: warn
