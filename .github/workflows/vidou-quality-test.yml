name: Vidou Heroine Motion Quality Test

on:
  push:
    branches: [vidou-quality-test-v01]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          pip install playwright opencv-python-headless numpy
          playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Restore heroine reference
        run: |
          python - <<'PY'
          import base64,json,urllib.request
          sha='1690eb6fedbf0b29dea2613d7dbd41d4f0f8819a'
          with urllib.request.urlopen(f'https://api.github.com/repos/yeqingzhu1971-code/12345/git/blobs/{sha}') as r:d=json.load(r)
          open('female_ref.jpg','wb').write(base64.b64decode(d['content']))
          PY
      - name: Generate genuine motion through Vidou web app
        run: |
          set -o pipefail
          mkdir -p output
          python - <<'PY' 2>&1 | tee output/generation.log
          import asyncio,base64,json,time
          from pathlib import Path
          from playwright.async_api import async_playwright

          prompt=('Cinematic live-action, a single continuous shot in a professional Beijing dance academy rehearsal studio in warm early-autumn afternoon sunlight. '
                  'Preserve the exact identity, face, large expressive eyes, hair bun, skin tone and black practice clothes of the young Chinese female dancer in the reference image. '
                  'She has just finished rehearsal, breathes naturally and blinks once. A classmate calls from behind the camera. '
                  'She briefly pauses, then naturally turns her head toward the camera and gives a bright spontaneous smile with small dimples. '
                  'Warm side-back sunlight catches a few sweat-damp loose hair strands; background dancers continue gentle movements in soft focus. '
                  'Very slow stable camera push-in, coherent facial features and anatomy, realistic hair and cloth motion, natural skin texture, full colour. '
                  'No speech, no subtitles, no text, no watermark, no face morphing, no distorted eyes or mouth, no black-and-white, no frozen or slideshow motion.')

          async def save_source(page,ctx,before):
            srcs=await page.evaluate("() => [...document.querySelectorAll('video,video source')].map(e=>e.currentSrc||e.src||e.getAttribute('src')||'').filter(Boolean)")
            fresh=[s for s in srcs if s not in before]
            print('all sources',srcs,'fresh',fresh)
            for src in fresh:
              try:
                if src.startswith('blob:'):
                  b64=await page.evaluate("""async u=>{let a=new Uint8Array(await (await fetch(u)).arrayBuffer()),s='',n=32768;for(let i=0;i<a.length;i+=n)s+=String.fromCharCode(...a.subarray(i,i+n));return btoa(s)}""",src);data=base64.b64decode(b64)
                else:
                  r=await ctx.request.get(src,timeout=180000);data=await r.body() if r.ok else b''
                if len(data)>10000:Path('output/vidou_source.mp4').write_bytes(data);return True
              except Exception as e:print('save error',repr(e))
            return False

          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--disable-dev-shm-usage','--enable-unsafe-webgpu'])
              ctx=await browser.new_context(viewport={'width':1440,'height':1000},locale='en-US',accept_downloads=True)
              page=await ctx.new_page();net=[]
              async def rr(r):
                u=r.url.lower();ct=(r.headers.get('content-type') or '').lower()
                if any(k in u for k in ['generate','upload','task','video','media']) or 'video/' in ct:net.append({'status':r.status,'url':r.url,'ct':ct})
              page.on('response',rr);page.on('console',lambda m:print('CONSOLE',m.type,m.text));page.on('pageerror',lambda e:print('PAGEERROR',e))
              await page.goto('https://vidou.ai/',wait_until='networkidle',timeout=120000);await page.wait_for_timeout(5000)
              before=set(await page.evaluate("() => [...document.querySelectorAll('video,video source')].map(e=>e.currentSrc||e.src||e.getAttribute('src')||'').filter(Boolean)"))
              controls=await page.evaluate("() => [...document.querySelectorAll('input,textarea,button,select')].map((e,i)=>({i,tag:e.tagName,type:e.type||'',placeholder:e.placeholder||'',text:(e.innerText||e.value||'').trim(),accept:e.accept||'',disabled:e.disabled,outer:e.outerHTML.slice(0,400)}))")
              print('controls',json.dumps(controls,ensure_ascii=False,indent=2));Path('output/controls.json').write_text(json.dumps(controls,ensure_ascii=False,indent=2),encoding='utf-8')
              file_inputs=page.locator('input[type=file]')
              if await file_inputs.count():
                await file_inputs.first.set_input_files('female_ref.jpg')
              else:
                upload=page.get_by_text('Click or drag to upload image',exact=False)
                async with page.expect_file_chooser(timeout=30000) as fi:await upload.first.click()
                await (await fi.value).set_files('female_ref.jpg')
              await page.wait_for_timeout(5000)
              # Fill the first meaningful textarea/text input after upload.
              ta=page.locator('textarea')
              if await ta.count():await ta.first.fill(prompt)
              else:
                candidates=page.locator('input:not([type=file]):not([type=hidden])')
                done=False
                for i in range(await candidates.count()):
                  el=candidates.nth(i);ph=(await el.get_attribute('placeholder') or '').lower()
                  if 'prompt' in ph or 'motion' in ph or 'describe' in ph:
                    await el.fill(prompt);done=True;break
                if not done:raise RuntimeError('No prompt field found')
              # Choose 16:9 when exposed.
              ar=page.get_by_text('16:9',exact=True)
              if await ar.count():
                try:await ar.first.click()
                except:pass
              await page.screenshot(path='output/ready.png',full_page=True)
              gen=page.get_by_role('button',name='Generate Video',exact=False)
              if not await gen.count():gen=page.get_by_text('Generate Video',exact=False)
              await gen.first.click()
              print('submitted');await page.screenshot(path='output/submitted.png',full_page=True)
              end=time.time()+45*60;last=''
              while time.time()<end:
                await page.wait_for_timeout(4000);body=await page.locator('body').inner_text();Path('output/network.json').write_text(json.dumps(net[-1000:],ensure_ascii=False,indent=2),encoding='utf-8')
                if body!=last:print('BODY',body[:6000].replace('\n',' | '));last=body
                if any(x in body.lower() for x in ['sign in','log in','credits required','payment required']):raise RuntimeError('Vidou unexpectedly required login/payment')
                if await save_source(page,ctx,before):break
                # Try a result/download control if it appears.
                for t in ['Download','Save Video','View Result']:
                  l=page.get_by_text(t,exact=False)
                  if await l.count():
                    try:
                      async with page.expect_download(timeout=5000) as di:await l.last.click()
                      await (await di.value).save_as('output/vidou_source.mp4');break
                    except:pass
                if Path('output/vidou_source.mp4').exists():break
              else:raise TimeoutError('Vidou did not return a generated video')
              await page.screenshot(path='output/completed.png',full_page=True);await browser.close()
          asyncio.run(main())
          PY
      - name: QC and encode 1080p review
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames,pix_fmt,duration -show_entries format=duration,size,bit_rate -of json output/vidou_source.mp4 | tee output/source_ffprobe.json
          ffmpeg -y -i output/vidou_source.mp4 -vf "scale=1920:1080:force_original_aspect_ratio=decrease:flags=lanczos,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:black,format=yuv420p" -c:v libx264 -preset slow -crf 14 -movflags +faststart -an output/vidou_heroine_motion_review_1080p.mp4
          python - <<'PY'
          import cv2,numpy as np,json
          c=cv2.VideoCapture('output/vidou_source.mp4');g=[];col=[]
          while 1:
            ok,f=c.read()
            if not ok:break
            g.append(cv2.cvtColor(f,cv2.COLOR_BGR2GRAY));col.append(np.mean(np.max(f,axis=2)-np.min(f,axis=2)))
          if len(g)<24:raise SystemExit('too few frames')
          d=np.array([np.mean(cv2.absdiff(g[i],g[i-1])) for i in range(1,len(g))]);q={'frames':len(g),'mean_diff':float(d.mean()),'motion_ratio':float((d>.75).mean()),'colour_proxy':float(np.mean(col))};open('output/qc.json','w').write(json.dumps(q,indent=2));print(q)
          if q['motion_ratio']<.6 or q['colour_proxy']<3:raise SystemExit('quality gate failed')
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidou-heroine-motion-review-v01
          path: output/
          compression-level: 0
          retention-days: 7
